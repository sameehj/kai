<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Kai</title>
<style>
  body { margin: 0; width: 300px; background: #101114; color: #fff;
         font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .top { padding: 16px; display: flex; align-items: center; gap: 10px;
         background: radial-gradient(120% 90% at 50% 0%, rgba(217,255,63,.16), transparent 70%); }
  .top img { width: 34px; height: 34px; }
  h1 { margin: 0; font-size: 16px; }
  #state { color: #A7ABB4; font-size: 12px; }
  #state.ok { color: #D9FF3F; } #state.bad { color: #FFB547; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 16px 14px; }
  .stat { background: #1C1D21; border: 1px solid #2A2C32; border-radius: 10px; padding: 8px 10px; }
  .stat b { display: block; font-size: 18px; }
  .stat span { color: #A7ABB4; font-size: 11px; }
  .help { margin: 0 16px 16px; padding: 10px 12px; background: #1C1D21; border-radius: 10px; color: #C9CCD3;
          font-size: 12px; display: none; }
  code { color: #D9FF3F; }
  .setting { margin: 0 16px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #A7ABB4; }
  select { background: #1C1D21; color: #fff; border: 1px solid #2A2C32; border-radius: 8px; padding: 6px 8px;
           font: inherit; font-size: 13px; }
</style>
</head>
<body>
  <div class="top">
    <img src="icons/kai-48.png" alt="">
    <div><h1>Kai</h1><div id="state">Checking…</div></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="checked">0</b><span>checked</span></div>
    <div class="stat"><b id="cleaned">0</b><span>cleaned</span></div>
    <div class="stat"><b id="held">0</b><span>held</span></div>
  </div>
  <div class="setting">
    <label for="failmode">If Kai isn't reachable</label>
    <select id="failmode">
      <option value="ask">Ask me before sending</option>
      <option value="send">Send without checking</option>
    </select>
  </div>
  <div class="help" id="help">The extension can't reach Kai on this Mac. In Terminal run
    <code>kai install chrome</code>, then restart the browser.</div>
  <script src="popup.js"></script>
</body>
</html>
