version: "3.8"
services:
  app:
    image: nginx:alpine
    ports:
      - "8080:80"
    deploy:
      resources:
        limits:
          memory: 256M

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: demo
    deploy:
      resources:
        limits:
          memory: 256M

  load:
    image: alpine
    command: >
      sh -c "apk add --no-cache curl && while true; do
        curl -s http://app:80 > /dev/null 2>&1
        sleep 0.01
      done"
    depends_on:
      - app
