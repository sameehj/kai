# On a version tag: build and test the tagged commit on macOS (Kai is macOS
# only: macOS 13 or later; Linux and Windows aren't supported). This workflow
# doesn't publish: the release is the Developer ID signed, notarized package
# from scripts/release/build-preview-pkg.sh, published with `gh release create`
# (docs/release/CHECKLIST-v0.2.0-preview.1.md). An automatic release here would
# race it with an unsigned build.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    name: tagged commit builds and tests (macOS, universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: universal CLI
        run: make CC="cc -arch x86_64 -arch arm64" && make test
      - name: menu-bar app (universal)
        run: |
          brew install xcodegen
          make app XCODE_EXTRA="ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO"
