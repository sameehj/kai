name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: libcurl headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: build
        run: make
      - name: unit + hook tests
        run: make test
      - name: sanitizer build (Linux only)
        if: runner.os == 'Linux'
        run: make asan

  macos-app:
    name: macOS app + network extension build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: make app

  self-scan:
    name: kai scans its own tree for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: make
      - name: fail if any tracked file contains a secret
        run: |
          # exclude only files with deliberate fake secrets: tests, design docs
          # with examples, and the browser test page
          git ls-files | grep -v -e '^tests/' -e '^docs/' -e 'kai-browser-test\.html$' \
            | xargs ./kai scan > scan.txt || true
          grep -v ': no findings' scan.txt && exit 1 || echo "no secrets found"
