# SPDX-License-Identifier: GPL-3.0-only OR LicenseRef-Kai-Commercial
#
# Xcode project for Kai.app and its network system extension. The .xcodeproj
# is generated from this file (it is not committed):
#
#   make app         ad-hoc signed build, no extension entitlements (CI)
#   make app-dev     signed with your Apple team, extension works (see Makefile)
#
name: Kai
options:
  bundleIdPrefix: io.github.sameehj
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  # Readable by Xcode 15 (CI runners) as well as newer Xcode versions.
  projectFormat: xcode15_0
settings:
  base:
    DEVELOPMENT_TEAM: ${KAI_TEAM}
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # Our app group is Team-ID-prefixed (KD446VDTM2.io.github.sameehj.kai),
    # which macOS self-provisions. Don't let automatic signing try to register
    # it in the developer portal: that needs a live login and makes Xcode
    # report "profile doesn't support the App Groups capability" when it can't.
    REGISTER_APP_GROUPS: NO
    MARKETING_VERSION: "0.1.0"
    # The app's build number. Bump freely for app changes (menu bar, signing);
    # this does NOT touch the network extension, so app updates never replace
    # it and never drop agents' live connections.
    CURRENT_PROJECT_VERSION: "6"
    # The network extension's own build number. Bump ONLY when the extension's
    # code (app/macos/Network) changes: macOS replaces an activated extension
    # when this differs, which tears down the content filter.
    KAI_EXT_VERSION: "7"
    SWIFT_VERSION: "5.9"

targets:
  # The shared C policy engine (include/kai.h), compiled for whatever
  # architecture Xcode builds. Same sources as `make`.
  libkai:
    type: library.static
    platform: macOS
    sources:
      - path: ../../src/util.c
      - path: ../../src/policy.c
      - path: ../../src/scan.c
      - path: ../../src/sha256.c
      - path: ../../src/audit.c
      - path: ../../src/net.c
      - path: ../../src/storage.c
      - path: ../../src/storage_prof.c
      - path: ../../src/grant.c
      - path: ../../src/approval_store.c
      - path: ../../src/proc.c
      - path: ../../src/shell.c
      - path: ../../third_party/cjson/cJSON.c
    settings:
      base:
        PRODUCT_NAME: kai
        GCC_C_LANGUAGE_STANDARD: c11
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/../../include", "$(SRCROOT)/../../third_party/cjson"]
        GCC_PREPROCESSOR_DEFINITIONS: ["_POSIX_C_SOURCE=200809L", "_DARWIN_C_SOURCE"]
        SKIP_INSTALL: YES

  KaiNetwork:
    type: system-extension
    platform: macOS
    sources: [Network]
    dependencies:
      - target: libkai
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
    info:
      path: Network/Info.plist
      properties:
        CFBundleDisplayName: Kai Network
        # macOS only treats the bundle as a system extension with type SYSX.
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Its own version, not the app's: app updates don't replace the extension.
        CFBundleVersion: $(KAI_EXT_VERSION)
        NSHumanReadableCopyright: GPL-3.0 · The Kai Authors
        NSSystemExtensionUsageDescription: Kai checks where AI agents send data and blocks connections your policy does not allow.
        NetworkExtension:
          NEMachServiceName: $(TeamIdentifierPrefix)io.github.sameehj.kai.network
          NEProviderClasses:
            com.apple.networkextension.filter-data: $(PRODUCT_MODULE_NAME).FilterDataProvider
    entitlements:
      path: Network/Network.entitlements
      properties:
        com.apple.developer.networking.networkextension: [content-filter-provider]
        # NEMachServiceName must start with an app group the extension holds.
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)io.github.sameehj.kai]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sameehj.kai.network
        PRODUCT_NAME: io.github.sameehj.kai.network
        PRODUCT_MODULE_NAME: KaiNetwork
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/KaiCore
        SKIP_INSTALL: YES

  Kai:
    type: application
    platform: macOS
    sources: [Sources/KaiBar, Sources/Assets.xcassets]
    dependencies:
      - target: KaiNetwork
      - target: libkai            # Scoped Approvals: sign grants in-process (no agent-callable signing)
      - sdk: NetworkExtension.framework
      - sdk: SystemExtensions.framework
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Kai
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: GPL-3.0 · The Kai Authors
    entitlements:
      path: Sources/Kai.entitlements
      properties:
        com.apple.developer.system-extension.install: true
        com.apple.developer.networking.networkextension: [content-filter-provider]
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)io.github.sameehj.kai]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sameehj.kai
        PRODUCT_NAME: Kai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/KaiCore   # expose libkai's C API as `import KaiCore`
    postBuildScripts:
      # Ship the kai CLI inside the app; the app uses it when none is installed.
      - name: Bundle kai CLI
        basedOnDependencyAnalysis: false
        script: |
          set -e
          make -C "$SRCROOT/../.." kai >/dev/null
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/kai"
          mkdir -p "$(dirname "$dest")"
          cp "$SRCROOT/../../kai" "$dest"
          # The browser extension, so `kai install chrome` can point at it.
          ext="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/browser"
          rm -rf "$ext" && mkdir -p "$ext/icons"
          cp "$SRCROOT/../../integrations/browser/"*.js "$SRCROOT/../../integrations/browser/"*.json \
             "$SRCROOT/../../integrations/browser/popup.html" "$ext/"
          cp "$SRCROOT/../../integrations/browser/icons/"*.png "$ext/icons/"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --options runtime --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$dest"
          else
            codesign --force --sign - "$dest"
          fi
