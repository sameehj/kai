version: "3.9"
services:
  web:
    build: ./web
    environment:
      API_URL: http://api:8081
    depends_on:
      - api
    ports:
      - "8080:8080"

  api:
    build: ./api
    environment:
      REDIS_ADDR: redis:6379
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on:
      - redis
      - postgres
    ports:
      - "8081:8081"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
