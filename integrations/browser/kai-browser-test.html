<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only OR LicenseRef-Kai-Commercial
     Local test page for the Kai extension. Open it as a file:// URL after
     turning on "Allow access to file URLs" for Kai in chrome://extensions. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kai extension test page</title>
<style>
  body { font: 15px/1.5 -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px;
         background: #f5f5f4; color: #1c1917; }
  form { display: flex; gap: 8px; margin: 12px 0 24px; }
  textarea, .ce { flex: 1; min-height: 64px; padding: 10px; border: 1px solid #a8a29e; border-radius: 10px;
                  background: #fff; font: inherit; }
  button { padding: 0 18px; border-radius: 10px; border: 0; background: #1c1917; color: #fff; font: inherit; }
  #log { background: #fff; border: 1px solid #e7e5e4; border-radius: 10px; padding: 10px; min-height: 60px;
         white-space: pre-wrap; font: 13px ui-monospace, monospace; }
  code { background: #e7e5e4; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <h1>Kai extension test page</h1>
  <p>Try sending <code>deploy with AKIAIOSFODNN7EXAMPLE</code> (a fake AWS key), or paste it in.
     A message with no secrets goes straight through.</p>

  <h2>Textarea composer</h2>
  <form id="f1"><textarea id="t1" aria-label="Message (textarea)"></textarea>
    <button type="submit" aria-label="Send message">Send</button></form>

  <h2>Rich-text composer</h2>
  <form id="f2"><div class="ce" id="t2" contenteditable="true" role="textbox" aria-label="Message (rich text)"></div>
    <button type="submit" aria-label="Send message">Send</button></form>

  <h2>What the "chat" received</h2>
  <div id="log" aria-live="polite"></div>

  <script>
    const log = (s) => { document.getElementById("log").textContent += s + "\n"; };
    for (const [form, box] of [["f1", "t1"], ["f2", "t2"]]) {
      const f = document.getElementById(form), b = document.getElementById(box);
      const send = () => {
        const text = b.tagName === "TEXTAREA" ? b.value : b.innerText;
        if (!text.trim()) return;
        log("SENT: " + text.trim());
        if (b.tagName === "TEXTAREA") b.value = ""; else b.textContent = "";
      };
      f.addEventListener("submit", (e) => { e.preventDefault(); send(); });
      b.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
    }
  </script>
</body>
</html>
