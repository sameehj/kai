# Kai ships for macOS (macOS 13 or later). The macOS jobs are required. The
# Windows job builds and tests the C core, CLI and hooks (dev preview, no app;
# docs/windows/README.md); the Linux job checks the Makefile build still
# compiles there.
name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    name: build + test (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make
      - name: unit + hook tests
        run: make test

  macos-app:
    name: macOS app + network extension build
    runs-on: macos-15   # macos-14 is retired on 2026-11-02
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: make app

  windows:
    name: build + test (windows-latest, dev preview)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: configure (MSVC, static runtime)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: build
        run: cmake --build build --config Release
      - name: unit, Windows, Watch, escape and hook tests (Watch live tests run too: runners are elevated)
        run: ctest --test-dir build -C Release --output-on-failure

  windows-app:
    name: app + MSI, unsigned (windows-latest, preview)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: install WiX 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: app view-model tests
        run: |
          dotnet build app/windows/Kai.Tests/Kai.Tests.csproj -c Release
          app/windows/Kai.Tests/bin/x64/Release/net10.0-windows10.0.19041.0/win-x64/Kai.Tests.exe
        shell: pwsh
      - name: MSI (no signing in CI)
        run: powershell -ExecutionPolicy Bypass -File scripts/release/build-windows-msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: kai-windows-unsigned
          path: dist/windows/

  linux-build:
    name: build (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: build
        run: make

  self-scan:
    name: kai scans its own tree for secrets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - name: fail if any tracked file contains a secret
        run: |
          # exclude only files with deliberate fake secrets: tests, design docs
          # with examples, and the browser test page
          git ls-files | grep -v -e '^tests/' -e '^docs/' -e 'kai-browser-test\.html$' \
            | xargs ./kai scan > scan.txt || true
          grep -v ': no findings' scan.txt && exit 1 || echo "no secrets found"
