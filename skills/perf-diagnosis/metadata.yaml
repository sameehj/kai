name: perf-diagnosis
version: 0.1.0
description: Systematic Linux performance diagnosis
category: performance
author: kai
root: preferred
kernel_min: "4.18"
required_binaries:
  - ss
common_commands:
  - uptime
  - free -h
  - df -h
  - dmesg --time-format iso
  - mpstat -P ALL 1 3
  - pidstat -u 1 3
  - iostat -xz 1 3
