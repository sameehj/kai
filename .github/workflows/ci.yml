name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make
      - name: unit + hook tests
        run: make test
      - name: sanitizer build (Linux only)
        if: runner.os == 'Linux'
        run: make asan

  self-scan:
    name: kai scans its own tree for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make
      - name: fail if any tracked file contains a secret
        run: |
          # exclude tests, which contain deliberate fake secrets
          files=$(git ls-files | grep -v '^tests/' | grep -v '^docs/' || true)
          if [ -n "$files" ]; then ./kai scan $files || exit 1; fi
