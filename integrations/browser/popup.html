<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only OR LicenseRef-Kai-Commercial -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kai</title>
<style>
  body { margin: 0; width: 300px; background: #101114; color: #fff;
         font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .top { padding: 16px; display: flex; align-items: center; gap: 10px;
         background: radial-gradient(120% 90% at 50% 0%, rgba(217,255,63,.16), transparent 70%); }
  .top img { width: 34px; height: 34px; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; }
  #today { color: #A7ABB4; font-size: 12px; }
  .box { margin: 0 16px 12px; padding: 10px 12px; background: #1C1D21; border: 1px solid #2A2C32;
         border-radius: 10px; font-size: 12px; color: #C9CCD3; }
  .box b { color: #fff; font-weight: 600; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; }
  button { background: none; border: 1px solid #2A2C32; color: #D9FF3F; border-radius: 8px; padding: 4px 8px;
           font: inherit; font-size: 12px; cursor: pointer; }
  button:disabled { color: #A7ABB4; cursor: default; }
  .muted { color: #A7ABB4; }
  code { color: #D9FF3F; }
  a { color: #D9FF3F; text-decoration: none; }
  .setting { margin: 0 16px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #A7ABB4; }
  select { background: #1C1D21; color: #fff; border: 1px solid #2A2C32; border-radius: 8px; padding: 6px 8px;
           font: inherit; font-size: 13px; }
  .foot { margin: 0 16px 14px; font-size: 12px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="top">
    <img src="icons/kai-48.png" alt="">
    <div><h1 id="status">Checking…</h1><div id="today"></div></div>
  </div>
  <div class="box" id="help" hidden>
    <b>Kai isn't connected.</b> In Terminal run <code>kai install chrome</code>, then open
    <code>chrome://extensions</code> and click <b>Reload</b> on Kai. Until then, Kai asks before you send.
  </div>
  <div class="box" id="last" hidden>
    <div id="lastText"></div>
    <div class="row"><span class="muted" id="lastAgo"></span><button id="notSecretBtn">Not a secret</button></div>
  </div>
  <div class="setting">
    <label for="failmode">If Kai isn't reachable</label>
    <select id="failmode">
      <option value="ask">Ask me before sending</option>
      <option value="send">Send without checking</option>
    </select>
  </div>
  <div class="foot"><a id="coverage" href="https://github.com/sameehj/kai/blob/master/docs/COVERAGE.md#chats-ai-chat-sites-in-chrome-browser-extension" target="_blank">What Kai checks on each site ›</a></div>
  <script src="popup.js"></script>
</body>
</html>
